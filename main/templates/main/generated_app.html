{% extends 'main/base.html' %}

{% block title %}Generated App{% endblock %}

{% block extra_head %}
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        script-src 'unsafe-inline';
        style-src 'unsafe-inline';
        connect-src 'none';
        img-src data:;
        base-uri 'none';
        form-action 'none';
    ">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 32px;
            color: #1f2937;
        }
        .app-shell {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            padding: 24px;
        }
        h1 {
            margin-top: 0;
        }
        .panel {
            display: grid;
            gap: 18px;
            margin-top: 18px;
        }
        .inputs, .outputs {
            display: grid;
            gap: 12px;
        }
        .field-block {
            display: grid;
            gap: 8px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            background: #fafafa;
        }
        .repeatable-inputs {
            display: grid;
            gap: 8px;
        }
        .repeatable-item {
            display: grid;
            gap: 6px;
        }
        label {
            font-weight: 600;
        }
        input[type="text"], input[type="file"], input[type="number"], textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
        }
        .add-repeatable-input {
            width: fit-content;
            background: #e0e7ff;
            color: #1e3a8a;
        }
        button:hover {
            background: #1d4ed8;
        }
        .output-box {
            min-height: 48px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #f9fafb;
            overflow-wrap: anywhere;
        }
        .output-image {
            max-width: 100%;
            max-height: 280px;
            border-radius: 8px;
            display: none;
        }
        .pdf-link {
            display: inline-block;
            margin-top: 8px;
            color: #1d4ed8;
            text-decoration: underline;
            word-break: break-all;
        }
        .error {
            color: #b91c1c;
            font-weight: 600;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="app-shell">
        <h1>Generated App</h1>

        <div class="panel">
            <div>
                <h2>Inputs</h2>
                <div class="inputs">
                    {{ rendered_inputs|safe }}
                </div>
            </div>

            <button type="button" id="run-app-button">Run</button>

            <div>
                <h2>Outputs</h2>
                <div class="outputs">
                    {{ rendered_outputs|safe }}
                </div>
            </div>
        </div>
    </div>

    <script>
        const appInputs = {{ inputs_json|safe }};
        const appOutputs = {{ outputs_json|safe }};

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('Unable to read file.'));
                reader.readAsDataURL(file);
            });
        }

        async function getOpenablePdfUrl(value) {
            if (!value || typeof value !== 'string') {
                return '';
            }

            if (value.startsWith('data:')) {
                const response = await fetch(value);
                const blob = await response.blob();
                return URL.createObjectURL(blob);
            }

            return value;
        }

        async function setOutputValue(name, value) {
            const target = document.getElementById(name);
            if (!target) return;

            const outputMeta = appOutputs.find((item) => item.name === name) || {};
            const isArrayOutput = outputMeta.count === '*' || Array.isArray(value);
            const outputType = (outputMeta.type || target.dataset.outputType || 'string').toLowerCase();

            if (isArrayOutput) {
                const items = Array.isArray(value) ? value : [value];
                target.innerHTML = '';

                if (outputType === 'image') {
                    items.forEach((item) => {
                        const img = document.createElement('img');
                        img.className = 'output-image';
                        img.alt = `${name} result`;
                        img.src = item || '';
                        img.style.display = item ? 'block' : 'none';
                        target.appendChild(img);
                    });
                    return;
                }

                if (outputType === 'pdf') {
                    for (const item of items) {
                        const link = document.createElement('a');
                        link.className = 'pdf-link';
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        link.textContent = item ? 'Open PDF' : 'No PDF available';

                        if (item) {
                            link.href = await getOpenablePdfUrl(item);
                        } else {
                            link.removeAttribute('href');
                        }

                        target.appendChild(link);
                    }
                    return;
                }

                items.forEach((item) => {
                    const row = document.createElement('div');
                    row.className = 'output-array-item';
                    row.textContent = item ?? '';
                    target.appendChild(row);
                });
                return;
            }

            if (target.tagName === 'IMG') {
                target.src = value || '';
                target.style.display = value ? 'block' : 'none';
                return;
            }

            if (outputType === 'pdf') {
                target.innerHTML = '';
                if (!value) {
                    target.textContent = 'Waiting for result...';
                    return;
                }

                const link = document.createElement('a');
                link.className = 'pdf-link';
                link.href = await getOpenablePdfUrl(value);
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = 'Open PDF';
                target.appendChild(link);
                return;
            }

            target.textContent = value ?? '';
        }

        function addRepeatableInput(groupName) {
            const group = document.querySelector(`[data-input-group="${groupName}"]`);
            if (!group) return;

            const index = group.querySelectorAll('.repeatable-item').length;
            const templateField = group.querySelector('.repeatable-item');
            if (!templateField) return;

            const clone = templateField.cloneNode(true);
            const input = clone.querySelector('textarea, input');
            if (!input) return;

            input.id = `${groupName}_${index}`;
            input.name = groupName;
            input.value = '';
            input.dataset.repeatIndex = String(index);
            group.appendChild(clone);
        }

        document.querySelectorAll('.add-repeatable-input').forEach((button) => {
            button.addEventListener('click', () => addRepeatableInput(button.dataset.targetName));
        });

        async function collectInputs() {
            const values = {};

            for (const field of appInputs) {
                const name = field.name;
                const count = field.count || '1';
                const fieldType = (field.type || 'String').toLowerCase();
                const group = document.querySelectorAll(`[data-input-group="${name}"] .repeatable-item input, [data-input-group="${name}"] .repeatable-item textarea`);
                const collected = [];

                for (const input of group) {
                    if (input.type === 'file') {
                        if (input.files && input.files[0]) {
                            collected.push(await readFileAsDataUrl(input.files[0]));
                        } else {
                            collected.push('');
                        }
                        continue;
                    }

                    if (fieldType === 'number') {
                        const rawValue = input.value;
                        collected.push(rawValue === '' ? '' : Number(rawValue));
                        continue;
                    }

                    collected.push(input.value);
                }

                values[name] = count === '*' ? collected : (collected[0] ?? '');
            }

            return values;
        }

        document.getElementById('run-app-button').addEventListener('click', async () => {
            try {
                const inputValues = await collectInputs();
                const context = { ...inputValues };

                {% for item in outputs %}
                    context['{{ item.name }}'] = '';
                {% endfor %}

                {% for item in inputs %}
                    {% if item.count == '*' %}
                        const {{ item.name }} = inputValues['{{ item.name }}'] ?? [];
                    {% else %}
                        const {{ item.name }} = inputValues['{{ item.name }}'] ?? '';
                    {% endif %}
                {% endfor %}

                {% for item in outputs %}
                    {% if item.count == '*' %}
                        let {{ item.name }} = [];
                    {% else %}
                        let {{ item.name }} = '';
                    {% endif %}
                {% endfor %}

                {{ code_snippet|safe }}

                {% for item in outputs %}
                    await setOutputValue('{{ item.name }}', {{ item.name }});
                {% endfor %}
            } catch (error) {
                const statusEl = document.getElementById('run-app-status');
                if (statusEl) {
                    statusEl.textContent = error.message || 'Something went wrong.';
                }
                console.error(error);
            }
        });
    </script>
{% endblock %}
