{% extends 'main/base.html' %}

{% block title %}Sign up{% endblock %}

{% block extra_head %}
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 24px;
            font-size: 2.25rem;
            color: #1a202c;
            font-weight: 700;
        }

        form {
            background-color: #ffffff;
            padding: 32px;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 480px; /* Slightly wider to comfortably hold password requirements */
        }

        /* Django form paragraph wrapper */
        form p {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #4a5568;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
        }

        /* Django form help text & requirements */
        .helptext, 
        form p ul {
            font-size: 0.8rem;
            color: #718096;
            line-height: 1.4;
            margin-top: 2px;
        }

        form p ul {
            padding-left: 18px;
            margin-top: 4px;
        }

        /* Django form validation errors */
        .errorlist {
            list-style: none;
            color: #e53e3e;
            font-size: 0.85rem;
            margin-bottom: 6px;
            font-weight: 500;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #3182ce;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        button[type="submit"]:hover {
            background-color: #2b6cb0;
        }

        button[type="submit"]:active {
            background-color: #2c5282;
        }
    </style>
{% endblock %}

{% block content %}

    <main class="main-container">
        <h1>Sign up</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign up</button>
        </form>
    </main>
{% endblock %}
